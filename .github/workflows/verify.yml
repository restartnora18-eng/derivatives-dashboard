name: Verify dashboard

on:
  push:
    paths-ignore:
      - 'data/**'
      - 'funding-data.js'
      - 'history-data.js'
      - 'binance-oi-minutes.json'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline Python checks
        run: python -B -m unittest discover -s tests -v
      - name: Offline JavaScript checks
        run: |
          node --check app.js
          node --check history-ui.js
          node --test tests/*.cjs
      - name: Build static files
        run: python -B build_site.py --hosted
